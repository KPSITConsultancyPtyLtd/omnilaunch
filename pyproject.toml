[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omnilaunch"
dynamic = ["version"]
description = "Run Linux, Windows and macOS apps through one launcher"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = ["Operating System :: POSIX :: Linux", "Environment :: Console"]

[project.scripts]
omnilaunch = "omnilaunch.cli:main"

[tool.setuptools]
packages = ["omnilaunch"]

[tool.setuptools.dynamic]
version = { attr = "omnilaunch.__version__" }
