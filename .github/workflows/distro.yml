name: distro

# Builds OmniLaunch OS for PCs (x86_64) and ARM (aarch64): the OS image, checks it, then a live USB
# .iso with an installer. ISOs are kept for one day under the run's Artifacts (they're several GB).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["distro/**", ".github/workflows/distro.yml"]

concurrency:
  group: distro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: OmniLaunch OS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Make room and use the biggest disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          root_free=$(df --output=avail -k / | tail -1)
          mnt_free=$(df --output=avail -k /mnt 2>/dev/null | tail -1 || echo 0)
          if [ "${mnt_free:-0}" -gt "$root_free" ]; then work=/mnt/work; else work=/var/tmp/work; fi
          sudo mkdir -p "$work/containers" "$work/tmp" "$work/iso" "$work/payload"
          sudo chmod 1777 "$work/tmp"
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "%s/containers"\n' "$work" | sudo tee /etc/containers/storage.conf
          echo "WORK=$work" >> "$GITHUB_ENV"
          df -h / /mnt 2>/dev/null || df -h /

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq podman skopeo
          podman --version

      - name: Build the OS image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077; printf '%s' "$GITHUB_TOKEN" > "$WORK/tmp/token"; umask 022
          sudo TMPDIR="$WORK/tmp" podman build --pull=newer \
            --secret id=github_token,src="$WORK/tmp/token" \
            -t localhost/omnilaunch-os:latest -f distro/Containerfile .
          rm -f "$WORK/tmp/token"
          sudo podman images

      - name: Check the OS image
        run: sudo podman run --rm -v "$PWD/distro/build/check.sh:/check.sh:ro" localhost/omnilaunch-os:latest bash /check.sh

      - name: Build the live USB image
        run: |
          # What the installer installs: the OS image squashed to one layer, so it's stored once on the USB.
          echo "FROM localhost/omnilaunch-os:latest" | \
            sudo TMPDIR="$WORK/tmp" podman build --squash-all -t localhost/omnilaunch-os-flat:latest -f - .
          sudo TMPDIR="$WORK/tmp" skopeo copy containers-storage:localhost/omnilaunch-os-flat:latest "oci:$WORK/payload:latest"
          sudo podman rmi localhost/omnilaunch-os-flat:latest
          sudo TMPDIR="$WORK/tmp" podman build --cap-add sys_admin --security-opt label=disable \
            -v "$WORK/payload:/payload:ro" \
            -t localhost/omnilaunch-os-live:latest -f distro/Containerfile.live .
          sudo rm -rf "$WORK/payload"

      - name: Make the .iso (titanoboa)
        run: |
          git clone --depth 1 https://github.com/ublue-os/titanoboa "$RUNNER_TEMP/titanoboa"
          iso=$(TITANOBOA_CTR_IMAGE=localhost/omnilaunch-os-live:latest TITANOBOA_OUTPUT_DIR="$WORK/iso" \
                bash "$RUNNER_TEMP/titanoboa/main.sh")
          name="OmniLaunch-OS-${{ matrix.arch }}.iso"
          sudo mv "$iso" "$WORK/iso/$name"
          sudo chown -R "$(id -u):$(id -g)" "$WORK/iso"
          (cd "$WORK/iso" && sha256sum "$name" | tee "$name.sha256")
          ls -lh "$WORK/iso"
          echo "ISO=$WORK/iso/$name" >> "$GITHUB_ENV"

      - name: Check the .iso has its boot files and live system
        run: |
          sudo apt-get install -yq xorriso >/dev/null
          xorriso -indev "$ISO" -ls /LiveOS /images/pxeboot /EFI/BOOT 2>&1 | tee files.txt
          grep -q squashfs.img files.txt && grep -q vmlinuz files.txt && grep -q initrd.img files.txt

      - uses: actions/upload-artifact@v4
        with:
          name: OmniLaunch-OS-${{ matrix.arch }}
          path: |
            ${{ env.ISO }}
            ${{ env.ISO }}.sha256
          retention-days: 1
          compression-level: 0
