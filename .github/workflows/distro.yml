name: distro

# Builds OmniLaunch OS for PCs (x86_64) and ARM (aarch64): the OS image, checks it, then a live USB
# .iso with an installer. ISOs are kept for one day under the run's Artifacts (they're several GB).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["distro/**", ".github/workflows/distro.yml"]

concurrency:
  group: distro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: OmniLaunch OS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Make room and use the biggest disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell /usr/lib/jvm /opt/microsoft /opt/az \
            /opt/google /usr/local/lib/node_modules /usr/share/miniconda /opt/pipx /usr/lib/google-cloud-sdk \
            /usr/local/julia* /usr/local/share/chromium /opt/mssql-tools /usr/share/kotlinc || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          root_free=$(df --output=avail -k / | tail -1)
          mnt_free=$(df --output=avail -k /mnt 2>/dev/null | tail -1 || echo 0)
          if [ "${mnt_free:-0}" -gt "$root_free" ]; then work=/mnt/work; else work=/var/tmp/work; fi
          sudo mkdir -p "$work/containers" "$work/tmp" "$work/iso" "$work/payload"
          sudo chmod 1777 "$work/tmp"
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "%s/containers"\n' "$work" | sudo tee /etc/containers/storage.conf
          echo "WORK=$work" >> "$GITHUB_ENV"
          df -h / /mnt 2>/dev/null || df -h /

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq podman skopeo
          podman --version

      - name: Build the OS image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077; printf '%s' "$GITHUB_TOKEN" > "$WORK/tmp/token"; umask 022
          sudo TMPDIR="$WORK/tmp" podman build --pull=newer \
            --secret id=github_token,src="$WORK/tmp/token" \
            -t localhost/omnilaunch-os:latest -f distro/Containerfile .
          rm -f "$WORK/tmp/token"
          sudo podman images

      - name: Check the OS image
        run: sudo podman run --rm -v "$PWD/distro/build/check.sh:/check.sh:ro" localhost/omnilaunch-os:latest bash /check.sh

      - name: Build the live USB image
        run: |
          sudo TMPDIR="$WORK/tmp" podman build -t localhost/omnilaunch-os-live:latest -f distro/Containerfile.live .
          # What the installer installs: the OS image squashed to one layer in a vfs store (plain files),
          # so the ISO's squashfs stores each file once, shared with the identical live-system file.
          echo "FROM localhost/omnilaunch-os:latest" | \
            sudo TMPDIR="$WORK/tmp" podman build --squash-all -t localhost/omnilaunch-os-flat:latest -f - .
          sudo TMPDIR="$WORK/tmp" skopeo copy containers-storage:localhost/omnilaunch-os-flat:latest \
            "containers-storage:[vfs@$WORK/payload+/run/omnilaunch-payload]localhost/omnilaunch-os:latest"
          sudo podman rmi localhost/omnilaunch-os-flat:latest
          sudo podman image prune -f
          df -h "$WORK"

      - name: Make the .iso (titanoboa)
        run: |
          git clone --depth 1 https://github.com/ublue-os/titanoboa "$RUNNER_TEMP/titanoboa"
          # titanoboa's main.sh, plus the installer's OS store attached inside the live system.
          sudo podman run --rm -i --cap-add sys_admin --security-opt label=disable \
            -v "$RUNNER_TEMP/titanoboa/build_iso.sh:/src/build_iso.sh:ro" \
            --mount type=image,source=localhost/omnilaunch-os-live:latest,dst=/rootfs \
            -v "$WORK/payload:/rootfs/var/lib/containers/storage:ro" \
            -v "$WORK/iso:/output" \
            quay.io/fedora/fedora:latest /src/build_iso.sh
          name="OmniLaunch-OS-${{ matrix.arch }}.iso"
          sudo mv "$WORK/iso/OmniLaunch-OS.iso" "$WORK/iso/$name"
          sudo chown -R "$(id -u):$(id -g)" "$WORK/iso"
          (cd "$WORK/iso" && sha256sum "$name" | tee "$name.sha256")
          ls -lh "$WORK/iso"
          echo "ISO=$WORK/iso/$name" >> "$GITHUB_ENV"

      - name: Check the payload made it into the live system
        run: |
          sudo apt-get install -yq squashfs-tools >/dev/null
          xorriso -osirrox on -indev "$ISO" -extract /LiveOS/squashfs.img "$WORK/squashfs.img" >/dev/null 2>&1 || \
            { sudo apt-get install -yq xorriso >/dev/null; xorriso -osirrox on -indev "$ISO" -extract /LiveOS/squashfs.img "$WORK/squashfs.img" >/dev/null 2>&1; }
          sudo unsquashfs -l "$WORK/squashfs.img" 'var/lib/containers/storage/vfs-images/*' | tee payload.txt
          grep -q images.json payload.txt
          rm -f "$WORK/squashfs.img"

      - name: Check the .iso has its boot files and live system
        run: |
          sudo apt-get install -yq xorriso >/dev/null
          xorriso -indev "$ISO" -ls /LiveOS /images/pxeboot /EFI/BOOT 2>&1 | tee files.txt
          grep -q squashfs.img files.txt && grep -q vmlinuz files.txt && grep -q initrd.img files.txt

      - name: Boot the .iso in a virtual machine
        if: matrix.arch == 'x86_64'
        timeout-minutes: 20
        run: |
          if [ ! -e /dev/kvm ]; then echo "No KVM on this runner; skipping the boot test"; exit 0; fi
          sudo chmod 666 /dev/kvm
          sudo apt-get install -yq qemu-system-x86 >/dev/null
          mkdir -p boot
          xorriso -osirrox on -indev "$ISO" -extract /images/pxeboot/vmlinuz boot/vmlinuz \
                  -extract /images/pxeboot/initrd.img boot/initrd.img >/dev/null 2>&1
          chmod 644 boot/*
          # The same kernel, initramfs and live system as the USB, with a serial console to watch.
          timeout 900 qemu-system-x86_64 -enable-kvm -m 6144 -smp 4 -nographic -no-reboot \
            -cdrom "$ISO" -kernel boot/vmlinuz -initrd boot/initrd.img \
            -append "root=live:CDLABEL=OmniLaunch-OS rd.live.image enforcing=0 console=ttyS0 systemd.unit=multi-user.target" \
            > boot.log 2>&1 &
          for i in $(seq 1 170); do
            if grep -qE "login:|Reached target.*Multi-User" boot.log; then ok=1; break; fi
            if grep -qE "Kernel panic|dracut-emergency|Entering emergency mode" boot.log; then break; fi
            sleep 5
          done
          kill %1 2>/dev/null || true
          grep -E "OmniLaunch OS|Reached target|login:|panic|emergency" boot.log | tail -15
          [ "${ok:-}" = 1 ] || { echo "The live system didn't finish booting"; tail -60 boot.log; exit 1; }
          echo "PASS  the live USB boots to OmniLaunch OS"

      - uses: actions/upload-artifact@v4
        with:
          name: OmniLaunch-OS-${{ matrix.arch }}
          path: |
            ${{ env.ISO }}
            ${{ env.ISO }}.sha256
          retention-days: 1
          compression-level: 0
