name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Real-world checks (downloads, double-click registration, .dmg install)
        if: matrix.python == '3.13'
        run: python tests/ci_real_checks.py
        env:
          OMNILAUNCH_HOME: ${{ runner.temp }}/omnilaunch
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test (real host)
        run: |
          python bin/omnilaunch doctor
          python bin/omnilaunch info "${{ runner.os == 'Windows' && 'C:\Windows\System32\notepad.exe' || '/bin/ls' }}"
          python -m pip install .
          omnilaunch --version
        shell: bash

  box64:
    name: Box64 + Wine on ARM64 runs real Windows programs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Windows cross-compilers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64 gcc-mingw-w64-i686
      - name: Build image and run Windows programs
        run: python tests/ci_box64.py
        env:
          OMNILAUNCH_HOME: ${{ runner.temp }}/omnilaunch
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
