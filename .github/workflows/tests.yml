name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test (real host)
        run: |
          python bin/omnilaunch doctor
          python bin/omnilaunch info "${{ runner.os == 'Windows' && 'C:\Windows\System32\notepad.exe' || '/bin/ls' }}"
          python -m pip install .
          omnilaunch --version
        shell: bash
