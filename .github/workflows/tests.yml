name: tests

on:
  push:
  pull_request:

# A newer push cancels an older run still in progress (cancelled runs send no failure email).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Real-world checks (downloads, double-click registration, .dmg install)
        if: matrix.python == '3.13'
        run: python tests/ci_real_checks.py
        env:
          OMNILAUNCH_HOME: ${{ runner.temp }}/omnilaunch
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test (real host)
        run: |
          python bin/omnilaunch doctor
          python bin/omnilaunch info "${{ runner.os == 'Windows' && 'C:\Windows\System32\notepad.exe' || '/bin/ls' }}"
          python -m pip install .
          omnilaunch --version
        shell: bash

